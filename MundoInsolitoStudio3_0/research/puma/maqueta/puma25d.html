<g font-size="26" fill="#1e1a12">
  <text x="40" y="60" font-size="40" font-weight="bold" fill="#1b140c">PUMA (Puma concolor): maqueta 2.5D</text>
  <text x="40" y="100" font-size="24">Ilustración 2.5D pintada · volumen, luz y profundidad por capas · macho adulto</text>

<rect x="0" y="842" width="1600" height="158" fill="#1b1d14" opacity="0.72"/>
<g font-size="20" fill="#f4ead8">
  <text x="60" y="870">· Orejas pequeñas y redondeadas, dorso oscuro · nariz rosada oscura · hocico blanco con manchas en la base de los bigotes</text>
  <text x="60" y="905">· Pelaje leonado uniforme sin manchas, vientre claro · cola larga y gruesa con la punta oscura · sin melena</text>
  <text x="60" y="940">· Patas traseras largas y potentes · digitígrado, garras retraídas · ojos ámbar con pupila redonda</text>
</g>

<script>
let seed = 7; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const NS = 'http://www.w3.org/2000/svg';
const add = (g, d, c, w, o) => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('stroke', css(c)); p.setAttribute('stroke-width', w); p.setAttribute('fill', 'none'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('opacity', o); g.appendChild(p); };
const hx = (x) => typeof x === 'string' ? [1, 3, 5].map((i) => parseInt(x.slice(i, i + 2), 16)) : x;
const mixA = (a, b, t) => { const A = hx(a), B = hx(b); return A.map((v, i) => v + (B[i] - v) * t); };
const css = (a) => 'rgb(' + hx(a).map(Math.round).join(',') + ')';
const mix = mixA;
// campo de dirección del pelo (ángulo en grados: 180 = hacia la cola)
function dirAt(x, y) {
  if (x > 1065 && y < 400) return 195 + (y - 320) * 0.15;        // cabeza: hacia atrás
  if (x > 960 && y >= 360 && y < 620) return 115;                 // cuello y pecho: hacia abajo
  if (x > 880 && y >= 600) return 92;                             // pata delantera
  if (x < 640 && y > 600) return 95;                              // pata trasera
  if (x < 620 && y > 390) return 125 + (y - 390) * 0.12;          // muslo
  return 182 + (y - 450) * 0.08;                                  // tronco
}
function colAt(x, y) {
  const belly = Math.max(0, Math.min(1, (y - 520) / 110));
  const leg = y > 640 ? Math.min(1, (y - 640) / 140) : 0;
  let base = mix('#6a4528', '#b78c5e', Math.min(1, (y - 320) / 160));
  base = mix(base, '#efe2c8', Math.max(belly * (x > 600 && x < 1010 ? 1 : 0.3), leg * 0.8));
  if (x > 990 && y > 400 && y < 640) base = mix(base, '#efe4cf', 0.55);
  return base;
}
const fur = document.getElementById("furBody");
for (let i = 0; i < 9000; i++) {
  const x = 400 + R() * 880, y = 240 + R() * 565;
  if (x > 1070 && y < 405) { R(); R(); R(); R(); R(); R(); continue; }
  const a = (dirAt(x, y) + (R() - 0.5) * 18) * Math.PI / 180;
  const L = 9 + R() * 12, bend = (R() - 0.5) * 5;
  const dx = Math.cos(a) * L, dy = Math.sin(a) * L;
  const light = R();
  const c = light < 0.45 ? mix(colAt(x, y), '#3a2414', 0.35) : light < 0.85 ? colAt(x, y) : mix(colAt(x, y), '#fff1d4', 0.5);
  add(fur, `M${x} ${y} q${dx / 2 - dy * bend / L} ${dy / 2 + dx * bend / L} ${dx} ${dy}`, c, 1 + R() * 1.4, 0.32 + R() * 0.3);
}
const fF = document.getElementById('faceFur');
for (let i = 0; i < 6000; i++) {
  const x = 1055 + R() * 230, y = 235 + R() * 180;
  let ang;
  if (x > 1205 && y < 330) ang = 200 + (y - 300) * 0.4;           // puente nasal: hacia la frente
  else if (y < 280) ang = 190;                                     // frente y cráneo
  else if (x > 1195 && y > 330) ang = 120;                         // hocico: hacia abajo
  else ang = 160 + (y - 320) * 0.25;                               // mejilla: hacia atrás y abajo
  const a = (ang + (R() - 0.5) * 20) * Math.PI / 180, L = 3 + R() * 5;
  const base = y > 360 ? '#cdb08a' : y < 270 ? '#8a6240' : '#a77d55';
  const c = R() < 0.4 ? mixA(base, '#2e1c10', 0.45) : R() < 0.75 ? hx(base) : mixA(base, '#fff2d8', 0.55);
  add(fF, `M${x} ${y} l${Math.cos(a) * L} ${Math.sin(a) * L}`, c, 0.45 + R() * 0.6, 0.4 + R() * 0.3);
}
const pf = document.getElementById('padFur');
for (let i = 0; i < 180; i++) {           // mancha de los bigotes hecha de pelo oscuro
  const x = 1210 + R() * 34, y = 336 + R() * 16;
  const dx = (x - 1227) / 17, dy = (y - 344) / 8;
  if (dx * dx + dy * dy > 1) continue;
  const a = (115 + (R() - 0.5) * 30) * Math.PI / 180, L = 2.5 + R() * 3;
  add(pf, `M${x} ${y} l${Math.cos(a) * L * 0.7} ${Math.sin(a) * L * 0.7}`, R() < 0.7 ? '#2a1c12' : '#6a5040', 0.5 + R() * 0.4, 0.45);
}
for (let i = 0; i < 500; i++) {           // pelo blanco del hocico y la barbilla
  const x = 1190 + R() * 80, y = 330 + R() * 75;
  const dx = (x - 1232) / 40, dy = (y - 365) / 34;
  if (dx * dx + dy * dy > 1) continue;
  const a = (100 + (R() - 0.5) * 30) * Math.PI / 180, L = 2.5 + R() * 4;
  add(pf, `M${x} ${y} l${Math.cos(a) * L} ${Math.sin(a) * L}`, R() < 0.7 ? '#ffffff' : '#cdbda4', 0.5 + R() * 0.6, 0.6);
}
const ff = document.getElementById('furFarG');
for (let i = 0; i < 1200; i++) {
  const x = 550 + R() * 420, y = 540 + R() * 260;
  const a = (92 + (R() - 0.5) * 16) * Math.PI / 180, L = 8 + R() * 9;
  add(ff, `M${x} ${y} l${Math.cos(a) * L} ${Math.sin(a) * L}`, R() < 0.5 ? '#4a321e' : '#a08060', 1 + R(), 0.45);
}
const ft = document.getElementById('furTail');
for (let i = 0; i < 1500; i++) {
  const x = 300 + R() * 180, y = 360 + R() * 390;
  const a = (y < 650 ? 100 + (x - 380) * 0.2 : 30) * Math.PI / 180, L = 8 + R() * 10;
  const c = y > 680 && x > 350 ? '#24170f' : R() < 0.5 ? '#7c5634' : '#c9a273';
  add(ft, `M${x} ${y} l${Math.cos(a) * L} ${Math.sin(a) * L}`, c, 1.2 + R(), 0.4);
}
function grass(g, n, y0, y1, h0, h1, cols) {
  for (let i = 0; i < n; i++) {
    const x = R() * 1600, y = y0 + R() * (y1 - y0), h = h0 + R() * (h1 - h0), lean = (R() - 0.5) * h * 0.6;
    add(g, `M${x} ${y} q${lean * 0.3} ${-h * 0.6} ${lean} ${-h}`, cols[Math.floor(R() * cols.length)], 1.5 + R() * 2.5, 0.75 + R() * 0.25);
  }
}
grass(document.getElementById('grassBack'), 900, 700, 800, 10, 34, ['#7d7a46', '#9a8f52', '#5e5d36', '#b5a061']);
grass(document.getElementById('grassFront'), 700, 815, 1000, 30, 90, ['#4c4c2c', '#6e6a3a', '#8c8048', '#a8945a', '#3e3f24']);
for (const [x0, x1] of [[0, 260], [1360, 1600]]) for (let i = 0; i < 70; i++) { const x = x0 + R() * (x1 - x0), h = 120 + R() * 200, lean = (R() - 0.5) * 120; add(document.getElementById('grassNear'), `M${x} 1000 q${lean * 0.3} ${-h * 0.6} ${lean} ${-h}`, ['#3a3a20', '#5a5630', '#7a6e3c'][Math.floor(R() * 3)], 4 + R() * 5, 0.9); }
const pines = document.getElementById('pines');
for (let i = 0; i < 26; i++) {
  const x = R() * 1600, base = 585 + R() * 25, h = 60 + R() * 70, w = h * 0.28;
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', `M${x} ${base - h} L${x + w} ${base} L${x - w} ${base}Z`);
  pines.appendChild(p);
}
</script>
