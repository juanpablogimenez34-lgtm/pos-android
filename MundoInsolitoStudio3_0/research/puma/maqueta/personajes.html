<script>
let seed = 11; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const NS = 'http://www.w3.org/2000/svg';
const hx = (x) => typeof x === 'string' ? [1, 3, 5].map((i) => parseInt(x.slice(i, i + 2), 16)) : x;
const mixA = (a, b, t) => { const A = hx(a), B = hx(b); return A.map((v, i) => v + (B[i] - v) * t); };
const css = (a) => 'rgb(' + hx(a).map(Math.round).join(',') + ')';
const G = (id) => document.getElementById(id);
function line(g, d, c, w, o) { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('stroke', css(c)); p.setAttribute('stroke-width', w); p.setAttribute('fill', 'none'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('opacity', o); g.appendChild(p); }
function blob(g, cx, cy, rx, ry, rot, c, o) { const e = document.createElementNS(NS, 'ellipse'); e.setAttribute('cx', cx); e.setAttribute('cy', cy); e.setAttribute('rx', rx); e.setAttribute('ry', ry); e.setAttribute('transform', `rotate(${rot} ${cx} ${cy})`); e.setAttribute('fill', css(c)); e.setAttribute('opacity', o); e.setAttribute('filter', 'url(#soft1)'); g.appendChild(e); }
// pinceladas de pelo: dirección y color por posición (coordenadas locales del grupo)
function fur(g, n, x0, y0, w, h, dirFn, colFn, L0, L1, w0) {
  for (let i = 0; i < n; i++) {
    const x = x0 + R() * w, y = y0 + R() * h;
    const a = (dirFn(x, y) + (R() - 0.5) * 18) * Math.PI / 180, L = L0 + R() * (L1 - L0);
    const base = colFn(x, y), k = R();
    const c = k < 0.4 ? mixA(base, '#2e1c10', 0.4) : k < 0.8 ? hx(base) : mixA(base, '#fff2d8', 0.5);
    line(g, `M${x} ${y} l${Math.cos(a) * L} ${Math.sin(a) * L}`, c, w0 + R() * w0, 0.35 + R() * 0.3);
  }
}
// cachorro
fur(G('cubFurG'), 4500, 100, 90, 460, 330,
  (x, y) => x > 380 && y < 215 ? 195 : x > 370 && y > 200 ? 110 : y > 300 ? 95 : 182,
  (x, y) => y > 270 ? mixA('#bba07c', '#efe4d0', Math.min(1, (y - 270) / 60)) : y < 180 ? hx('#94785a') : hx('#b39a78'), 4, 9, 0.7);
for (let i = 0; i < 70; i++) {     // manchas oscuras irregulares en filas por lomo y flancos
  const row = Math.floor(R() * 3), x = 130 + R() * 250, y = 180 + row * 34 + (R() - 0.5) * 14;
  for (let k = 0; k < 3; k++) blob(G('cubSpots'), x + (R() - 0.5) * 8, y + (R() - 0.5) * 6, 5 + R() * 5, 3.5 + R() * 3, R() * 180, '#4a3220', 0.55 + R() * 0.2);
}
for (let i = 0; i < 18; i++) blob(G('cubSpots'), 140 + R() * 260, 330 + R() * 70, 3 + R() * 3, 2.5 + R() * 2, R() * 180, '#4a3220', 0.5);
for (let i = 0; i < 14; i++) blob(G('cubSpots'), 410 + R() * 60, 108 + R() * 30, 2 + R() * 2, 1.6 + R() * 1.5, R() * 180, '#4a3220', 0.5);
for (let r = 0; r < 5; r++) { const t = 0.3 + r * 0.15; const p = G('cubTail').getPointAtLength(G('cubTail').getTotalLength() * t * 0.5); blob(G('cubTailRings'), p.x, p.y, 16, 4, 30 + r * 10, '#3e2a1a', 0.75); }
fur(G('cubFarFur'), 500, 190, 290, 190, 120, () => 92, () => hx('#8a7258'), 4, 8, 0.6);
// recién nacido
fur(G('nbFur'), 1600, 0, -16, 250, 82, (x) => x > 160 ? 190 : 182, (x, y) => y > 40 ? hx('#d9c8ae') : hx('#a98e6e'), 3, 6, 0.6);
for (let i = 0; i < 60; i++) blob(G('nbSpots'), 20 + R() * 200, 5 + R() * 45, 3 + R() * 3, 2.5 + R() * 2, R() * 180, '#3e2a1a', 0.65);
// venado
fur(G('deerFurG'), 6000, 50, 140, 520, 470,
  (x, y) => x < 170 && y < 230 ? -15 : x < 260 && y < 330 ? 60 : y > 400 ? 90 : 0,
  (x, y) => y > 360 && x > 280 && x < 470 ? hx('#efe8dc') : y > 330 ? mixA('#a5805e', '#d8c4ac', (y - 330) / 50) : hx('#9a7656'), 4, 9, 0.7);
fur(G('deerFarFur'), 500, 270, 380, 220, 220, () => 90, () => hx('#6a503c'), 4, 8, 0.6);
// pasto
function grass(g, n, y0, y1, h0, h1, cols) { for (let i = 0; i < n; i++) { const x = R() * 1600, y = y0 + R() * (y1 - y0), h = h0 + R() * (h1 - h0), lean = (R() - 0.5) * h * 0.6; line(g, `M${x} ${y} q${lean * 0.3} ${-h * 0.6} ${lean} ${-h}`, cols[Math.floor(R() * cols.length)], 1.5 + R() * 2, 0.8); } }
grass(G('grassBack'), 700, 700, 810, 10, 30, ['#7d7a46', '#9a8f52', '#5e5d36', '#b5a061']);
grass(G('grassFront'), 400, 880, 1000, 20, 60, ['#4c4c2c', '#6e6a3a', '#8c8048', '#3e3f24']);
</script>
